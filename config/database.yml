default: &default
  adapter: sqlserver
  host: localhost
  port: 1433
  integrated_security: true
  encrypt: false
  trust_server_certificate: true

development:
  <<: *default
  database: PrinMedia

test:
  <<: *default
  database: PrinMedia

production:
  primary:
    adapter: sqlite3
    database: storage/production.sqlite3
    pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
    timeout: 5000
  cable:
    adapter: sqlite3
    database: storage/production_cable.sqlite3
    pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
    timeout: 5000
  cache:
    adapter: sqlite3
    database: storage/production_cache.sqlite3
    pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
    timeout: 5000
  queue:
    adapter: sqlite3
    database: storage/production_queue.sqlite3
    pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
    timeout: 5000